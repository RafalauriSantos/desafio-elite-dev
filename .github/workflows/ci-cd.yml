name: Elite Tickets CI/CD & Security Shield

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  deployments: write

jobs:
  # ----------------------------------------------------
  # JOB 1: Security & Secret Leak Audit
  # ----------------------------------------------------
  security-audit:
    name: 🛡️ Security Audit & Secret Leak Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Client Dependencies
        run: npm install --prefix client

      - name: Install Server Dependencies
        run: npm install --prefix server

      - name: Run NPM Security Audit
        run: |
          npm audit --prefix client --audit-level=high || true
          npm audit --prefix server --audit-level=high || true

  # ----------------------------------------------------
  # JOB 2: TypeCheck & Static Analysis
  # ----------------------------------------------------
  type-check:
    name: ⚙️ TypeScript TypeCheck & Static Analysis
    runs-on: ubuntu-latest
    needs: security-audit

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Client Dependencies
        run: npm install --prefix client

      - name: Install Server Dependencies
        run: npm install --prefix server

      - name: TypeCheck Front-End (Client)
        run: npm run typecheck --prefix client

      - name: TypeCheck Back-End (Server)
        run: npm run typecheck --prefix server

  # ----------------------------------------------------
  # JOB 3: Test Suite (Vitest Unit + Playwright E2E)
  # ----------------------------------------------------
  test-suite:
    name: 🧪 Automated Test Suite (Vitest + Playwright E2E)
    runs-on: ubuntu-latest
    needs: type-check

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python for Playwright & Local WebServer
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Client & Server Dependencies
        run: |
          npm install --prefix client
          npm install --prefix server

      - name: Run Client Vitest Unit Tests (Strict)
        run: npm run test --prefix client

      - name: Run Server Vitest Unit Tests (Strict)
        run: npm run test --prefix server

      - name: Setup Playwright & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pytest
          npx playwright install --with-deps chromium

      - name: Build Front-End Bundle for E2E
        run: npm run build --prefix client

      - name: Start Failproof Python WebServer for E2E
        run: |
          python -m http.server 5173 --directory client/dist &
          sleep 2

      - name: Run Playwright E2E Automation Suite (Strict)
        run: python tests/test_e2e.py
        env:
          CI: true
          E2E_TARGET_URL: "http://localhost:5173"

  # ----------------------------------------------------
  # JOB 4: Production Deployment to Cloudflare
  # ----------------------------------------------------
  deploy-production:
    name: 🚀 Production Deploy to Cloudflare (Pages + Workers)
    runs-on: ubuntu-latest
    needs: test-suite
    if: >-
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      && github.event_name == 'push'

    steps:
      - name: Check Cloudflare Secrets Availability
        id: check-secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "⚠️ Cloudflare secrets not configured. Skipping deploy."
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Cloudflare secrets found. Proceeding with deploy."
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Code
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Client & Server Dependencies
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          npm install --prefix client
          npm install --prefix server

      - name: Build Front-End Client
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: npm run build --prefix client

      - name: Deploy Front-End to Cloudflare Pages
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy client/dist --project-name=elite-tickets

      - name: Deploy Back-End Worker to Cloudflare Workers
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'server'
          command: deploy
          secrets: |
            SUPABASE_URL
            SUPABASE_ANON_KEY
            HMAC_SECRET
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}

      - name: Deploy Skipped Notice
        if: steps.check-secrets.outputs.has_secrets != 'true'
        run: |
          echo "::notice::🟡 Deploy skipped — CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID not configured."
          echo "To enable auto-deploy, add these secrets in GitHub Settings → Secrets and variables → Actions."

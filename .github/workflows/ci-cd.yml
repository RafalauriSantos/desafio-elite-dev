name: Elite Tickets CI/CD & Security Shield

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  deployments: write

jobs:
  # ----------------------------------------------------
  # JOB 1: Security & Secret Leak Audit
  # ----------------------------------------------------
  security-audit:
    name: 🛡️ Security Audit & Secret Leak Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Client Dependencies
        run: npm install --prefix client

      - name: Install Server Dependencies
        run: npm install --prefix server

      - name: Run NPM Security Audit
        run: |
          npm audit --prefix client --audit-level=high || true
          npm audit --prefix server --audit-level=high || true

  # ----------------------------------------------------
  # JOB 2: TypeCheck & Static Analysis
  # ----------------------------------------------------
  type-check:
    name: ⚙️ TypeScript TypeCheck & Static Analysis
    runs-on: ubuntu-latest
    needs: security-audit

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Client Dependencies
        run: npm install --prefix client

      - name: Install Server Dependencies
        run: npm install --prefix server

      - name: TypeCheck Front-End (Client)
        run: npm run typecheck --prefix client

      - name: TypeCheck Back-End (Server)
        run: npm run typecheck --prefix server

  # ----------------------------------------------------
  # JOB 3: Test Suite (Vitest Unit + Playwright E2E)
  # ----------------------------------------------------
  test-suite:
    name: 🧪 Automated Test Suite (Vitest + Playwright E2E)
    runs-on: ubuntu-latest
    needs: type-check

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python for Playwright Script
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Client & Server Dependencies
        run: |
          npm install --prefix client
          npm install --prefix server

      - name: Run Client Vitest Unit Tests (Strict)
        run: npm run test --prefix client

      - name: Run Server Vitest Unit Tests (Strict)
        run: npm run test --prefix server

      - name: Setup Playwright & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pytest
          npx playwright install --with-deps chromium

      - name: Build Front-End Bundle for E2E
        run: npm run build --prefix client

      - name: Start Local Preview Server for E2E
        run: |
          npx vite preview --prefix client --port 5173 &
          sleep 3

      - name: Run Playwright E2E Automation Suite (Strict)
        run: python tests/test_e2e.py
        env:
          CI: true
          E2E_TARGET_URL: "http://localhost:5173"

  # ----------------------------------------------------
  # JOB 4: Production Deployment to Cloudflare
  # ----------------------------------------------------
  deploy-production:
    name: 🚀 Production Deploy to Cloudflare (Pages + Workers)
    runs-on: ubuntu-latest
    needs: test-suite
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Client & Server Dependencies
        run: |
          npm install --prefix client
          npm install --prefix server

      - name: Build Front-End Client
        run: npm run build --prefix client

      - name: Deploy Front-End to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'elite-tickets'
          directory: 'client/dist'
          gitBranch: 'master'

      - name: Deploy Back-End Worker to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'server'
          secrets: |
            SUPABASE_URL
            SUPABASE_ANON_KEY
            HMAC_SECRET
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}

      - name: Verify Production API Health Check
        run: |
          echo "Verificando o endpoint de saúde do Worker na borda..."
          curl -f -s https://elite-tickets-api.agenddar.workers.dev/api/health
